name: ai-workflow-atlas
services:
  db:
    image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    environment:
      POSTGRES_USER: atlas
      POSTGRES_DB: atlas_dev
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Run npm run db:local first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
