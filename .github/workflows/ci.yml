name: Application and PostgreSQL checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Disposable CI service credentials; never used for a deployed database.
      DATABASE_URL: postgresql://atlas:ci_only@127.0.0.1:5432/atlas_test
      TEST_DATABASE_URL: postgresql://atlas:ci_only@127.0.0.1:5432/atlas_test
    services:
      postgres:
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run db:status
      - run: npm run test:db
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: node scripts/test-public-runtime.mjs
      - run: npm run test:e2e -- --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
